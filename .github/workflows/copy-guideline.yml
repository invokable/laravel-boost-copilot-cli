name: Copy guideline

on:
  push:
    branches: [ main ]
    paths:
      - 'resources/boost/guidelines/core.blade.php'

permissions:
  contents: write

jobs:
  copy-guideline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Copy guideline
        run: cp resources/boost/guidelines/core.blade.php .ai/guidelines/copilot-cli.blade.php

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: Update guideline
          commit_options: '--no-verify'
          file_pattern: '.ai/guidelines/copilot-cli.blade.php'
